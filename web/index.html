<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 用量面板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>AI 用量</h1>
    <div class="header-right">
      <span id="updated-at" class="updated"></span>
      <button id="refresh-btn" type="button">刷新</button>
    </div>
  </header>
  <div id="error-banner" class="error-banner" hidden></div>
  <main id="cards"></main>
  <!-- 齿轮和设置视图由 app.js 生成，不写死在这里。
       原因：这个页面会被浏览器缓存住，而 /static/app.js 有 no-cache 永远是新的。
       界面元素写在 HTML 里的话，新脚本会对着旧 DOM 找不到元素，功能就静默消失了
       ——真踩过这个坑。让永远最新的那一方来建，就不存在版本错配。 -->
  <script src="/static/app.js"></script>
</body>
</html>

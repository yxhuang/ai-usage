<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 用量面板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>AI 用量</h1>
    <div class="header-right">
      <span id="updated-at" class="updated"></span>
      <button id="refresh-btn" type="button">刷新</button>
    </div>
  </header>
  <div id="error-banner" class="error-banner" hidden></div>
  <main id="cards"></main>
  <footer class="settings">
    <button id="settings-toggle" type="button" class="settings-toggle"
            aria-expanded="false" aria-controls="settings-body">设置</button>
    <div id="settings-body" class="settings-body" hidden>
      <label class="setting-row">
        <input type="checkbox" id="hook-switch">
        <span class="setting-label">跟随编辑器启动</span>
      </label>
      <p id="hook-note" class="setting-note"></p>
    </div>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 用量面板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <button id="settings-btn" type="button" class="gear" title="设置"
            aria-label="设置" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <h1>AI 用量</h1>
    <div class="header-right">
      <span id="updated-at" class="updated"></span>
      <button id="refresh-btn" type="button">刷新</button>
    </div>
  </header>
  <div id="error-banner" class="error-banner" hidden></div>
  <main id="cards"></main>
  <!-- 设置是「另一个视图」，跟卡片互斥显示。放在卡片下面的话，窗口一装满就被挤出可视区。 -->
  <section id="settings" class="settings" hidden>
    <label class="setting-row">
      <input type="checkbox" id="hook-switch">
      <span class="setting-label">跟随 VSCode 启动</span>
    </label>
    <p id="hook-note" class="setting-note"></p>
  </section>
  <script src="/static/app.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 也跑一遍：README 说"应该能用但没在真机验证过"，
        # 至少让 CI 替我们确认代码路径本身在 macOS 上是通的
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        # 测试不联网、不读真实凭证；conftest 会剥掉凭证类环境变量
        run: uv run pytest -q
